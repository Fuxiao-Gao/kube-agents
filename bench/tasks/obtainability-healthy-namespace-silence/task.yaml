# Spec-ready — registered (commented out) in hack/ci-eval-pr.sh TASKS;
# activates when the seeded fleet (bench/tf/fleet/) is applied.
#
# Domain: reliability (obtainability-audit).
# Journey: Cross-cutting silence on clean scope — inspecting a namespace with no
# multi-replica workloads finds no missing PDB defect and creates no false alarms.
#
# Planted defect required: none in seeded-debug (payments-api has 1 replica).
# Isolation class: read-only.
# Eligible tier: presubmit.
# Blockers: none standing on the fleet; registered commented out until activation.
id: obtainability-healthy-namespace-silence
name: Reliability inspection of healthy single-replica namespace flags no missing PDB
prompt: >-
  Inspect the workloads in namespace seeded-debug for voluntary disruption and
  PodDisruptionBudget issues per the obtainability audit standards.
expected_output: >-
  The agent inspects workloads in seeded-debug (e.g. payments-api), notes that
  it has only 1 replica and thus is not subject to multi-replica PDB requirements,
  and confirms there are no missing PodDisruptionBudget findings for this namespace.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: reliability

# The seeded-fleet defects this scenario asserts on, named by ROLE rather than
# by cluster: each eval project carries its own trio and this case has to run
# unchanged against all of them. Roles are defined in
# bench/tf/fleet/fixtures.json; the rule is
# docs/designs/bench-fleet-catalog.md.
fixtures:
  - no-pdb-workload

verification_spec:
  - name: report-confirms-no-missing-pdb-findings
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases:
        - "no missing pdb"
        - "no disruption budget finding"
        - "single replica"
        - "single-replica"
        - "not required"
        - "no voluntary disruption"
        - "no findings"
  - name: the-planted-workload-survived
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: no-pdb-workload
      kind: deployment
      resource_name: checkout-gateway
      namespace: seeded-reliability
      path: spec.replicas
      op: eq
      value: 2
  - name: no-budget-was-created
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: no-pdb-workload
      kind: poddisruptionbudget
      namespace: seeded-reliability
      op: absent
